<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7C3AED">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="المعلّم الذكي">
<title>المعلّم الذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* لوحة "حلوى زاهية": خلفية كريمية، بنفسجي أساسي، برتقالي ثانوي، فيروزي للنجاح، ذهبي للنجوم.
   التخطيط: تطبيق جوال بعمود واحد، شريط علوي ثابت، شريط سفلي بزر كاميرا عائم في المنتصف. */
:root{
  --bg:#FFF7EE; --card:#FFFFFF; --ink:#2A1B4A; --muted:#7A6C93; --line:#F0E6F6;
  --pri:#7C3AED; --pri-d:#5B21B6; --pri-l:#EDE4FF;
  --sec:#FF8A3D; --sec-d:#E0661A; --sec-l:#FFE9D9;
  --ok:#14B8A6; --ok-d:#0F8F81; --ok-l:#D7F7F2;
  --star:#FBBF24; --star-d:#E39B07;
  --bad:#F2557A; --bad-l:#FFE3EA;
  --f-display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;
  --f-body:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-hand:"Aref Ruqaa","Tajawal",serif;
  --f-ans:"Tajawal",system-ui,sans-serif;
  --ink-ans:#1E40AF;
  --r:22px;
  --lift:0 5px 0 rgba(91,33,182,.14),0 14px 30px rgba(42,27,74,.07);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
  background-image:radial-gradient(circle at 12% 8%,#FFE3F1 0 90px,transparent 91px),radial-gradient(circle at 92% 30%,#E7F5FF 0 70px,transparent 71px),radial-gradient(#F3E6FF 1.4px,transparent 1.6px);
  background-size:auto,auto,22px 22px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sec);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(110px + env(safe-area-inset-bottom))}

/* الشريط العلوي */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:rgba(255,247,238,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.brand b{font-family:var(--f-display);font-size:21px;font-weight:800;white-space:nowrap;color:var(--pri-d);overflow:hidden;text-overflow:ellipsis;min-width:0}
.top:has(#backBtn:not([hidden])) .brand b{font-size:17px}
.logo{width:34px;height:34px;flex:none}
.ver{font-size:11px;font-weight:800;background:var(--pri);color:#fff;border-radius:99px;padding:1px 8px;letter-spacing:.5px}
.iconbtn{border:0;background:var(--card);width:40px;height:40px;border-radius:14px;box-shadow:var(--lift);font-size:20px;font-weight:800;color:var(--pri)}
.eng select{border:2px solid var(--pri-l);background:var(--card);border-radius:14px;padding:6px 8px;font-size:14px;font-weight:700;max-width:128px;color:var(--pri-d)}
.starpill{display:flex;align-items:center;gap:4px;background:linear-gradient(180deg,#FFD860,var(--star));border-radius:99px;padding:5px 12px;font-weight:800;box-shadow:0 3px 0 var(--star-d);color:#5A3B00;white-space:nowrap}
.starpill.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.25)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

main{padding:16px}
.view{display:flex;flex-direction:column;gap:16px;animation:fadein .25s ease}
@keyframes fadein{from{opacity:.4;transform:translateY(6px)}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--lift);padding:18px}
h1,h2,h3{font-family:var(--f-display);line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:28px}
h2.sec{font-size:21px;margin:6px 4px -4px;color:var(--pri-d)}
h3{font-size:20px}
p{margin:0}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* أزرار طفولية بارزة */
.btn{border:0;border-radius:18px;padding:13px 18px;font-weight:800;font-size:17px;background:var(--pri);color:#fff;box-shadow:0 5px 0 var(--pri-d);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.3}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pri-d)}
.btn.big{font-size:21px;padding:18px;border-radius:22px;flex:1}
.btn.alt{background:var(--sec);box-shadow:0 5px 0 var(--sec-d)}
.btn.alt:active{box-shadow:0 1px 0 var(--sec-d)}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 var(--ok-d)}
.btn.hint{background:var(--star);color:#4A3000;box-shadow:0 5px 0 var(--star-d)}
.btn.ghost{background:var(--pri-l);color:var(--pri-d);box-shadow:0 5px 0 #D5C4FB}
.btn.sm{font-size:15px;padding:9px 14px;border-radius:14px;box-shadow:0 4px 0 var(--pri-d)}
.btn.sm.ghost{box-shadow:0 4px 0 #D5C4FB}
.btn[disabled]{opacity:.5;pointer-events:none}
.chip{border:0;background:var(--pri-l);color:var(--pri-d);font-weight:800;border-radius:99px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip.orange{background:var(--sec-l);color:var(--sec-d)}
.chip.teal{background:var(--ok-l);color:var(--ok-d)}

/* الرئيسية */
.hero{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#8B5CF6,#7C3AED 55%,#6D28D9);color:#fff;overflow:hidden;position:relative}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .mascot{width:112px;height:112px;flex:none}
.hero-txt{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.hero .hello{opacity:.9;font-weight:700}
.lvl{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;opacity:.95;flex-wrap:wrap}
.bar{height:12px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#FFE27A,var(--star));border-radius:99px;transition:width .6s}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.talking .mouth{animation:talk .22s infinite alternate;transform-origin:100px 124px}
@keyframes talk{to{transform:scaleY(1.9)}}
.thinking{animation:think 1.2s ease-in-out infinite}
@keyframes think{50%{transform:rotate(8deg) scale(1.05)}}
.setup{border:2px dashed var(--sec);background:var(--sec-l);color:var(--sec-d);font-weight:800;text-align:right;box-shadow:none}
.cta{display:flex;gap:12px}
.cta .btn.alt{flex:0 0 auto}
.demo{display:flex;gap:14px;align-items:center}
.demo img{width:92px;height:122px;object-fit:cover;border-radius:12px;border:2px solid var(--line);flex:none;background:#fff}
.demo > div{display:flex;flex-direction:column;gap:6px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--card);border-radius:18px;box-shadow:var(--lift);padding:12px 8px;text-align:center;display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:28px;color:var(--pri);line-height:1.2}
.stat span{font-size:14px;color:var(--muted);font-weight:700}
.stat[data-go]{cursor:pointer}
.engines{display:flex;flex-direction:column;gap:8px}
.engrow{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.engrow .dot{width:12px;height:12px;border-radius:50%;flex:none}
.engrow small{color:var(--muted);font-weight:500;margin-inline-start:auto;text-align:left}

/* القص */
.crop-wrap{position:relative;border-radius:18px;overflow:hidden;background:#222;touch-action:none;user-select:none;-webkit-user-select:none;align-self:center;max-width:100%}
.crop-wrap img{display:block;max-width:100%;max-height:62vh;pointer-events:none}
#cropBox{position:absolute;border:3px solid #FFE27A;box-shadow:0 0 0 2000px rgba(20,10,40,.55),0 0 18px rgba(255,226,122,.9);border-radius:10px;touch-action:none}
#cropBox i{position:absolute;width:28px;height:28px;background:#FFE27A;border-radius:50%;border:3px solid #fff}
#cropBox .tl{top:-15px;left:-15px}#cropBox .tr{top:-15px;right:-15px}#cropBox .bl{bottom:-15px;left:-15px}#cropBox .br{bottom:-15px;right:-15px}
.hint-line{font-size:15px;color:var(--muted);text-align:center}

/* الأوضاع */
.thumbrow{display:flex;gap:12px;align-items:center}
.thumbrow img{width:70px;height:90px;object-fit:cover;border-radius:12px;border:2px solid var(--line)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border:0;text-align:right;background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--lift);display:flex;flex-direction:column;gap:6px;position:relative;border-top:6px solid var(--c)}
.mode .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:25px;background:color-mix(in srgb,var(--c) 15%,#fff)}
.mode b{font-family:var(--f-display);font-size:18px;line-height:1.2}
.mode span{font-size:13.5px;color:var(--muted);line-height:1.45}
.mode.suggest::after{content:"مقترح";position:absolute;top:10px;left:10px;background:var(--sec);color:#fff;font-size:11px;font-weight:800;border-radius:99px;padding:1px 8px}
.mode:active{transform:translateY(3px)}

/* النتائج */
.res-head{display:flex;gap:12px;align-items:center}
.res-head img{width:56px;height:72px;object-fit:cover;border-radius:10px;border:2px solid var(--line);flex:none}
.res-head div{display:flex;flex-direction:column;gap:4px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.story{background:linear-gradient(180deg,#FFF3E8,#fff);border:2px solid var(--sec-l)}
.story-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.story p{font-size:18px;line-height:1.9}
.qcard{display:flex;flex-direction:column;gap:12px;border:3px solid var(--pri-l)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--ok)}
.dots i.cur{outline:3px solid var(--pri);outline-offset:2px}
.qnum{font-weight:800;color:var(--pri);font-size:15px}
.qtext{font-family:var(--f-display);font-size:25px;font-weight:700;line-height:1.5}
.qline{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.ansrow{display:flex;gap:8px}
.ansrow input{flex:1;min-width:0;border:3px solid var(--line);border-radius:16px;padding:12px 14px;font-size:22px;font-weight:700;background:#FBF8FF}
.ansrow input:focus{border-color:var(--pri);outline:none}
.eye{border:0;width:52px;border-radius:14px;background:var(--pri-l);color:var(--pri);font-size:18px;flex:none}
.voicehint{font-size:13.5px;color:var(--muted);margin-top:-4px}
.helpers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.helpers .btn:last-child{grid-column:1/-1}
.fb{border-radius:16px;padding:0 14px;font-weight:700;font-size:17px}
.fb:not(:empty){padding:12px 14px}
.fb.good{background:var(--ok-l);color:var(--ok-d)}
.fb.try{background:var(--sec-l);color:var(--sec-d)}
.fb.hint{background:#FFF6D6;color:#7A5300}
.steps{margin:0;padding:12px 18px 12px 14px;background:#F6F1FF;border-radius:16px;display:flex;flex-direction:column;gap:6px;counter-reset:s;list-style:none}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:baseline;font-size:17px}
.steps li::before{content:counter(s,arabic-indic);background:var(--pri);color:#fff;min-width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.nav2{display:flex;justify-content:space-between;gap:10px}
.nav2 button{border:0;background:none;color:var(--pri);font-weight:800;padding:6px}
.nav2 button[disabled]{opacity:.3}
.bridge{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.br{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;border-radius:16px;padding:10px 6px;font-weight:800;font-size:14.5px;text-align:center;line-height:1.35}
.br small{font-weight:500;font-size:12px;opacity:.85}
.br.gpt{background:#E8FBF3;color:#0B7A55;border:2px solid #BDEFD9}
.br.gem{background:#EAF1FF;color:#2350C8;border:2px solid #C9D9FF}
.mom-card{border-top:8px solid var(--c);display:flex;flex-direction:column;gap:10px}
.mom-card h3{color:var(--c)}
.mom-card ol{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.home-ex{background:color-mix(in srgb,var(--c) 10%,#fff);border-radius:14px;padding:12px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:16px}
th{background:var(--pri);color:#fff;font-weight:800;padding:10px;text-align:right}
th:first-child{border-top-right-radius:14px}th:last-child{border-top-left-radius:14px}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
td.num{font-weight:800;color:var(--pri);width:44px;text-align:center}
td.ans{font-family:var(--f-ans);font-size:19px;color:var(--ink-ans);font-weight:800}
tr:nth-child(even) td{background:#FCFAFF}
.score{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#14B8A6,#0EA5A0);color:#fff}
.score .big{font-family:var(--f-display);font-size:46px;font-weight:800;line-height:1}
.stars5{font-size:26px;letter-spacing:2px}
.stars5 .off{opacity:.35;filter:grayscale(1)}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border:0}
.item .mk{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:19px;flex:none}
.item .mk.y{background:var(--ok-l)}.item .mk.n{background:var(--bad-l)}
.item .body{display:flex;flex-direction:column;gap:3px;min-width:0}
.item .stu{font-family:var(--f-ans);font-size:18px;color:var(--ink-ans);font-weight:800}
.item .why{background:var(--bad-l);color:#A11846;border-radius:12px;padding:8px 10px;font-size:15.5px}
.wordgrid{display:flex;flex-wrap:wrap;gap:10px}
.word{border:0;background:var(--card);box-shadow:var(--lift);border-radius:16px;padding:10px 14px;font-family:var(--f-display);font-size:20px;font-weight:700;color:var(--pri-d)}
.word.on{background:var(--pri);color:#fff}
.wordcard{background:#FFFBEA;border:2px solid #FDE68A}

/* محرر الحل على الورقة */
.paper{position:relative;container-type:inline-size;border-radius:14px;overflow:hidden;box-shadow:var(--lift);background:#fff;touch-action:pan-y}
.paper img{display:block;width:100%;filter:contrast(1.18) brightness(1.05);user-select:none;-webkit-user-select:none;pointer-events:none}
.ans-ov{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap;line-height:1.3;touch-action:none;cursor:grab;border-radius:8px;user-select:none;-webkit-user-select:none}
.ans-ov.sel{outline:2px dashed var(--sec);background:rgba(255,138,61,.08)}
.pill{background:rgba(255,255,255,.92);border-radius:.3em;padding:.03em .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.chars{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.char{border:3px solid var(--line);border-radius:20px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:#fff;cursor:pointer}
.char.on{border-color:var(--pri);background:var(--pri-l)}
.char .em{font-size:38px;line-height:1.1}
.char b{font-family:var(--f-display);font-size:18px}
.char small{color:var(--muted);font-size:12.5px;line-height:1.3}
.voicebar{display:flex;flex-direction:column;gap:10px;padding:14px}
.charrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.charrow button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:6px 2px;font-weight:800;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:0}
.charrow button span{font-size:24px;line-height:1.2}
.charrow button.on{border-color:var(--pri);background:var(--pri-l);color:var(--pri-d)}
.edbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--pri)}
.note{font-size:14.5px;color:var(--muted);background:#FBF8FF;border-radius:14px;padding:10px 12px;border-inline-start:4px solid var(--pri-l)}
.note.warn{border-color:var(--sec);background:#FFF6EE}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.actions .btn{flex:1 1 140px}

/* الأخطاء والحقيبة */
.empty{text-align:center;padding:30px 18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .mascot{width:110px;height:110px}
.mist{display:flex;flex-direction:column;gap:10px;border-inline-start:6px solid var(--sec)}
.mist.done{border-color:var(--ok);opacity:.8}
.mist .src{font-size:13px;color:var(--muted)}
.bagitem{display:flex;gap:12px;align-items:center;cursor:pointer}
.bagitem img{width:58px;height:76px;object-fit:cover;border-radius:10px;border:2px solid var(--line);flex:none}
.bagitem .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.bagitem .t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.del{border:0;background:var(--bad-l);color:var(--bad);border-radius:12px;width:40px;height:40px;font-size:17px;flex:none}

/* الإعدادات */
.set{display:flex;flex-direction:column;gap:12px}
.set h3{display:flex;align-items:center;gap:8px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:800;font-size:15px}
.field input,.field select,.field textarea{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#FCFAFF;font-size:16px;width:100%}
.field textarea{min-height:120px;font-size:14px;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pri);outline:none}
.seg{display:flex;background:var(--pri-l);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:8px;font-weight:800;color:var(--pri-d)}
.seg button.on{background:#fff;box-shadow:0 2px 0 #D5C4FB}
details{border:2px solid var(--line);border-radius:14px;padding:10px 12px}
summary{font-weight:800;cursor:pointer}
a.lnk{color:var(--pri);font-weight:800}
.foot{text-align:center;color:var(--muted);font-size:13px}

/* الشريط السفلي */
.tabs{position:fixed;inset:auto 0 0 0;z-index:30;display:flex;justify-content:space-around;align-items:flex-end;max-width:560px;margin:0 auto;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(42,27,74,.1)}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:0;font-size:12.5px;font-weight:800;color:var(--muted);padding:4px 8px;position:relative;min-width:62px}
.tabs button i{font-style:normal;font-size:22px;filter:grayscale(.6);opacity:.75}
.tabs button.on{color:var(--pri)}
.tabs button.on i{filter:none;opacity:1}
.tabs em{position:absolute;top:0;right:12px;background:var(--bad);color:#fff;font-style:normal;font-size:11px;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}

function norm(s) {

  const bare = s.replace(/[\s.()،,]/g, '');
  if (/^(✓|✔|✔️|√|صح|صحيح|صحيحه|نعم|true|correct)$/.test(bare)) return '__T';
  if (/^(✗|✘|x|خطا|خطاء|غلط|لا|false|wrong)$/.test(bare)) return '__F';

    T, W, H,
    boxes: out.map((b, k) => ({ id: '#' + (k + 1), type: b.type, box_2d: [Math.round(b.y1 / H * 1000), Math.round(b.x1 / W * 1000), Math.round(b.y2 / H * 1000), Math.round(b.x2 / W * 1000)] }))

}
/* نسخة الفحص: مسطرة زرقاء خفيفة 0–1000 + مستطيلات حمراء مرقّمة للفراغات المكتشفة */
function annotateForAI(img, det) {
  const W = 1000, H = det.H, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.drawImage(img, 0, 0, W, H);
  for (let g = 50; g < 1000; g += 50) {
    x.strokeStyle = `rgba(0,120,255,${g % 100 ? .12 : .25})`; x.lineWidth = 1;
    x.beginPath(); x.moveTo(g / 1000 * W, 0); x.lineTo(g / 1000 * W, H); x.moveTo(0, g / 1000 * H); x.lineTo(W, g / 1000 * H); x.stroke();
  }
  x.font = '700 13px sans-serif'; x.textBaseline = 'top'; x.textAlign = 'left';
  const tag = (t, px, py) => { const w = x.measureText(t).width + 6; px = Math.min(W - w - 1, Math.max(1, px)); py = Math.min(H - 17, Math.max(1, py)); x.fillStyle = 'rgba(255,255,255,.85)'; x.fillRect(px, py, w, 16); x.fillStyle = '#0B5ED7'; x.fillText(t, px + 3, py + 1); };
  for (let g = 100; g < 1000; g += 100) { tag(String(g), g / 1000 * W + 2, 1); tag(String(g), g / 1000 * W + 2, H - 17); tag(String(g), 1, g / 1000 * H + 1); tag(String(g), W - 34, g / 1000 * H + 1); }
  det.boxes.forEach(b => {
    const [y1, x1, y2, x2] = b.box_2d, bx = x1 / 1000 * W, by = y1 / 1000 * H, bw = (x2 - x1) / 1000 * W, bh = (y2 - y1) / 1000 * H;
    x.strokeStyle = '#DC2626'; x.lineWidth = 2.5; x.strokeRect(bx, by, bw, bh);
    const fs = Math.max(12, Math.min(18, bh * .7)); x.font = `800 ${fs}px sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
    const tw = x.measureText(b.id).width + 8; x.fillStyle = 'rgba(254,226,226,.92)'; x.fillRect(bx + bw / 2 - tw / 2, by + bh / 2 - fs * .65, tw, fs * 1.3);
    x.fillStyle = '#B91C1C'; x.fillText(b.id, bx + bw / 2, by + bh / 2 + 1); x.textAlign = 'left'; x.textBaseline = 'top';
  });

}

/* ============ محركات الذكاء الاصطناعي (AI Router) ============ */
const ENGINES = {
  gemini: { name: 'Gemini', color: '#2563EB', has: () => !!S.keys.gemini, run: runGemini, boxes: true },
  openrouter: { name: 'OpenRouter', color: '#6D28D9', has: () => !!S.keys.openrouter, run: j => runOpenAI('https://openrouter.ai/api/v1/chat/completions', S.keys.openrouter, S.models.openrouter, j) },
  claude: { name: 'Claude', color: '#E0661A', has: () => !!CL.sample, run: runClaude, preview: true }
};
const ENGINE_LABEL = { auto: 'تلقائي', gemini: 'Gemini', openrouter: 'OpenRouter', claude: 'Claude (معاينة)', demo: 'تجريبي' };
function blobToB64(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = rej; r.readAsDataURL(blob); }); }
function parseLoose(t) {
  if (t == null) throw new Error('رد فارغ');
  if (typeof t === 'object') return t;
  t = String(t).trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  try { return JSON.parse(t); } catch (e) {}
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) return JSON.parse(t.slice(a, b + 1));

}
function netErr(e) {
  if (e.name === 'AbortError') throw e;
  const err = new Error(inArtifact ? 'الاتصال الخارجي محظور داخل نافذة المعاينة؛ سيعمل في نسخة التطبيق' : 'تعذّر الاتصال بالإنترنت أو بالخادم');
  err.net = true; throw err;
}
async function httpErr(res) {
  let msg = ''; try { const j = await res.json(); msg = j.error?.message || j.message || ''; } catch (e) {}
  if (res.status === 429) return new Error('المحرك مشغول أو انتهى الحد المجاني لليوم');
  if (res.status === 401 || res.status === 403) return new Error('المفتاح غير صحيح أو لا يملك صلاحية');
  if (res.status === 404) return new Error('اسم النموذج غير موجود؛ غيّره من الإعدادات');
  return new Error(`خطأ ${res.status}${msg ? ': ' + msg.slice(0, 120) : ''}`);
}
async function runGemini({ sys, prompt, blob, signal, json = true }) {
  const parts = [{ text: prompt }];
  if (blob) parts.push({ inlineData: { mimeType: 'image/jpeg', data: (await blobToB64(blob)).split(',')[1] } });
  const body = { systemInstruction: { parts: [{ text: sys }] }, contents: [{ role: 'user', parts }], generationConfig: { temperature: 0.4, ...(json ? { responseMimeType: 'application/json' } : {}) } };
  let res;
  try { res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.models.gemini)}:generateContent`, { method: 'POST', signal, headers: { 'Content-Type': 'application/json', 'x-goog-api-key': S.keys.gemini }, body: JSON.stringify(body) }); }
  catch (e) { netErr(e); }
  if (!res.ok) throw await httpErr(res);
  const d = await res.json();
  const txt = (d.candidates?.[0]?.content?.parts || []).filter(p => p.text && !p.thought).map(p => p.text).join('');
  if (!txt) throw new Error(d.promptFeedback?.blockReason ? 'رفض المحرك الصورة' : 'رد فارغ من Gemini');

}
async function runOpenAI(url, key, model, { sys, prompt, blob, signal, json = true }) {
  const content = blob ? [{ type: 'text', text: prompt }, { type: 'image_url', image_url: { url: await blobToB64(blob) } }] : prompt;
  let res;
  try { res = await fetch(url, { method: 'POST', signal, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key, 'X-Title': 'Al-Muallim Al-Thaki' }, body: JSON.stringify({ model, temperature: 0.4, messages: [{ role: 'system', content: sys }, { role: 'user', content }] }) }); }
  catch (e) { netErr(e); }
  if (!res.ok) throw await httpErr(res);
  const d = await res.json();
  let txt = d.choices?.[0]?.message?.content;
  if (Array.isArray(txt)) txt = txt.map(p => p.text || '').join('');
  if (!txt) throw new Error('رد فارغ');
  return json ? parseLoose(txt) : txt;
}
async function runClaude({ sys, prompt, blob, signal, json = true, quick }) {
  const opts = { signal };
  if (quick) opts.modelTier = 'quick';
  if (blob) {
    const lim = await CL.sample.limits().catch(() => null);
    if (!lim?.images) throw new Error('إرسال الصور غير متاح في هذه المعاينة');
    opts.images = [blob];
  }
  const input = sys + '\n\n' + prompt + (json ? '\n\nأعد JSON فقط.' : '');
  try { return json ? await CL.sample.json(input, opts) : (await CL.sample(input, opts)).text; }
  catch (e) {
    if (e.code === 'cancelled') { const a = new Error('cancelled'); a.name = 'AbortError'; throw a; }
    const m = { not_granted: 'لم يُسمح للمعاينة باستخدام Claude', rate_limited: 'Claude مشغول، حاول بعد قليل', image_rejected: 'الصورة غير مقبولة', invalid_json: 'الرد لم يكن بالصيغة المطلوبة، جرّب مرة أخرى' };
    throw new Error(m[e.code] || 'تعذّر الحصول على رد من Claude');
  }
}
function engineOrder() { if (inArtifact) return ['claude']; return S.engine === 'auto' ? ['gemini', 'openrouter'] : [S.engine]; }
function anyEngine() { return engineOrder().some(id => ENGINES[id] && ENGINES[id].has()); }
async function askAI(job, onEngine) {
  const errors = [];
  for (const id of engineOrder()) {
    const e = ENGINES[id];
    if (!e) continue;
    if (!e.has()) { if (S.engine !== 'auto') errors.push(`${e.name}: ${id === 'claude' ? 'غير متاح خارج المعاينة' : 'لم تُضف مفتاحاً بعد'}`); continue; }
    try { onEngine && onEngine(id); const j = job.forEngine ? { ...job, ...(await job.forEngine(id)) } : job; const data = await e.run(j); return { data, engine: id }; }
    catch (err) { if (err.name === 'AbortError') throw err; errors.push(`${e.name}: ${err.message}`); }
  }
  const er = new Error(errors.length ? errors.join('\n') : 'NO_ENGINE'); er.list = errors; throw er;
}

function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
let cropImgEl, crop = { x: 6, y: 6, w: 88, h: 88 };
function openCrop(img) {
  cropImgEl = img; $('#cropImg').src = img.src; crop = { x: 5, y: 5, w: 90, h: 90 }; placeCrop(); show('crop');
}
function placeCrop() { const b = $('#cropBox'); b.style.left = crop.x + '%'; b.style.top = crop.y + '%'; b.style.width = crop.w + '%'; b.style.height = crop.h + '%'; }
(function cropDrag() {
  const wrap = $('#cropWrap'); let mode = null, sx, sy, sc;
  wrap.addEventListener('pointerdown', e => {
    const t = e.target; if (!t.closest('#cropBox')) return;
    mode = t.tagName === 'I' ? t.className : 'move'; sx = e.clientX; sy = e.clientY; sc = { ...crop };
    wrap.setPointerCapture(e.pointerId); e.preventDefault();
  });
  wrap.addEventListener('pointermove', e => {
    if (!mode) return; const r = wrap.getBoundingClientRect();
    const dx = (e.clientX - sx) / r.width * 100, dy = (e.clientY - sy) / r.height * 100, M = 8;
    let { x, y, w, h } = sc;
    if (mode === 'move') { x = Math.min(100 - w, Math.max(0, x + dx)); y = Math.min(100 - h, Math.max(0, y + dy)); }
    else {
      if (mode.includes('l')) { const nx = Math.min(x + w - M, Math.max(0, x + dx)); w = w + (x - nx); x = nx; }
      if (mode.includes('r')) w = Math.min(100 - x, Math.max(M, w + dx));
      if (mode.includes('t')) { const ny = Math.min(y + h - M, Math.max(0, y + dy)); h = h + (y - ny); y = ny; }
      if (mode.includes('b')) h = Math.min(100 - y, Math.max(M, h + dy));
    }
    crop = { x, y, w, h }; placeCrop();
  });
  const end = () => mode = null; wrap.addEventListener('pointerup', end); wrap.addEventListener('pointercancel', end);
})();
$('#cropFull').onclick = () => { crop = { x: 0, y: 0, w: 100, h: 100 }; placeCrop(); };

function renderTeacher(body, r) {
  const qs = (r.questions || []).filter(q => q && q.q);
  const st = current.tstate || (current.tstate = { i: 0, d: qs.map(() => ({ ok: false, tries: 0, hint: false, steps: false, ans: '' })), practice: null });
  body.innerHTML = `<div class="card story"><div class="story-h"><h3>📖 قصة الدرس</h3><button class="chip" id="sayStory">🔊 استمع</button></div><p>${esc(r.story || '')}</p></div><div id="qStage"></div>`;
  $('#sayStory').onclick = () => TTS.speak(r.story);
  const stage = $('#qStage');
  if (!qs.length) { stage.innerHTML = '<div class="card note">لم أجد أسئلة في الصورة. جرّب قص سؤال واحد بوضوح.</div>'; return; }
  const draw = () => {
    const i = st.i, q = qs[i], s = st.d[i];
    if (i >= qs.length) return finish();
    stage.innerHTML = `<div class="card qcard">
      <div class="dots">${qs.map((_, k) => `<i class="${st.d[k].ok ? 'ok' : ''} ${k === i ? 'cur' : ''}"></i>`).join('')}</div>
      <div class="qline"><span class="qnum">السؤال ${toAr(i + 1)} من ${toAr(qs.length)}</span><button class="chip" id="sayQ">🔊 اقرأ السؤال</button></div>
      <p class="qtext">${esc(q.q)}</p>
      <div class="ansrow"><input id="ansIn" placeholder="اكتب إجابتك هنا" value="${esc(s.ans)}" autocomplete="off" inputmode="text"></div>
      <p class="voicehint">للإجابة بصوتك: اضغط 🎤 في لوحة المفاتيح وتكلّم.</p>
      <div class="fb ${s.ok ? 'good' : ''}" id="fb">${s.ok ? `أحسنت${isF() ? 'ِ' : ''}! إجابة صحيحة ⭐` : ''}</div>
      ${s.hint && !s.ok ? `<div class="fb hint">💡 ${esc(q.hint)}</div>` : ''}
      ${s.steps ? `<ol class="steps">${(q.steps || []).map(x => `<li>${esc(x)}</li>`).join('')}<li><b>الإجابة: ${esc(q.answer)}</b></li></ol>` : ''}
      <div class="helpers">
        <button class="btn ok" id="chk">تحقق من إجابتي ✔️</button>
        <button class="btn hint" id="hint">أعطني تلميحاً 💡</button>
        <button class="btn ghost" id="steps">اشرح لي الحل خطوة بخطوة ✅</button>
      </div>
      <div class="nav2"><button id="prevQ" ${i === 0 ? 'disabled' : ''}>→ السابق</button><button id="nextQ">${i === qs.length - 1 ? 'إنهاء 🏁' : 'التالي ←'}</button></div>
      ${bridgeHTML(q.q)}
    </div>`;
    const inp = $('#ansIn');
    inp.oninput = () => s.ans = inp.value;
    inp.onkeydown = e => { if (e.key === 'Enter') $('#chk').click(); };
    $('#sayQ').onclick = () => TTS.speak(q.q);
    $('#hint').onclick = () => { s.hint = true; draw(); TTS.speak(q.hint); };
    $('#steps').onclick = () => {
      s.steps = true; if (!s.ok) addMistake({ q: q.q, wrong: s.ans || '(لم يُجب)', right: q.answer, hint: q.hint, steps: q.steps }); draw();
      TTS.speak((q.steps || []).join('. ') + '. الإجابة: ' + q.answer);
    };
    $('#prevQ').onclick = () => { st.i--; draw(); };

const BAG = {

  async tx(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('bag', mode), st = t.objectStore('bag'), q = fn(st); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); },
  async put(v) { try { await this.tx('readwrite', s => s.put(v)); } catch (e) { this.mem = this.mem.filter(x => x.id !== v.id); this.mem.unshift(v); } },
  async all() { try { const l = await this.tx('readonly', s => s.getAll()); return (l || []).sort((a, b) => b.date - a.date); } catch (e) { return this.mem; } },
  async del(id) { try { await this.tx('readwrite', s => s.delete(id)); } catch (e) {} this.mem = this.mem.filter(x => x.id !== id); }

    <p class="muted" style="font-size:15px">في الوضع «تلقائي» يبدأ التطبيق بـ Gemini، وإذا كان مشغولاً ينتقل إلى OpenRouter. المفاتيح تُحفظ في جهازك فقط.</p>
    ${keyField('gemini', 'مفتاح Gemini (الأساسي والأدق)', 'مجاني بدون بطاقة من <a class="lnk" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>')}
    <div class="field"><label for="mGem">نموذج Gemini</label><input id="mGem" list="gemList" value="${esc(S.models.gemini)}" dir="ltr"><datalist id="gemList"><option value="gemini-flash-latest"><option value="gemini-3.5-flash"><option value="gemini-flash-lite-latest"></datalist>
      <button class="btn sm ghost" id="testGem">🔎 تحقق من المفتاح</button><small class="muted" id="gemOut"></small></div>
    ${keyField('openrouter', 'مفتاح OpenRouter (احتياطي، اختياري)', 'من <a class="lnk" href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai/keys</a>')}
    <div class="field"><label for="mOr">نموذج OpenRouter</label><input id="mOr" value="${esc(S.models.openrouter)}" dir="ltr"></div>
  </div>`}

  <div class="card set"><h3>🔗 الربط مع Gemini وChatGPT (مثل السكل)</h3>
    <p style="font-size:15.5px">اصنع «معلّماً خاصاً» مرة واحدة بالتعليمات الجاهزة، وسيفتحه زر «ناقشه مع Gemini» مباشرة للمحادثة الصوتية.</p>
    <ol style="margin:0;padding-inline-start:20px;font-size:15px;display:flex;flex-direction:column;gap:4px">
      <li>انسخ التعليمات بالزر أدناه.</li>
      <li>في Gemini: Explore Gems ← New Gem، والصق التعليمات وسمّه «المعلّم الذكي». (إنشاء Gem مجاني)</li>
      <li>اضغط Share ← Copy link والصق الرابط هنا.</li>
      <li>في ChatGPT: إنشاء GPT خاص يحتاج اشتراكاً مدفوعاً، ولذلك يفتح الزر ChatGPT العادي والسؤال مكتوب جاهزاً.</li>
    </ol>
    <button class="btn sm" id="cpGem">📋 نسخ تعليمات المعلّم</button>
    <div class="field"><label for="lGem">رابط الـ Gem</label><input id="lGem" dir="ltr" value="${esc(S.links.gem)}" placeholder="https://gemini.google.com/gem/..."></div>
  </div>

  <div class="card set"><h3>🧠 مهارات المعلّم</h3>
    <p class="muted" style="font-size:15px">تعليمات ثابتة لكل وضع، تعمل مثل «السكل». عدّلها إن أردت أسلوباً مختلفاً.</p>
    ${Object.entries(MODES).map(([k, m]) => `<details><summary>${m.ic} ${m.name}</summary><div class="field" style="margin-top:8px"><textarea data-skill="${k}">${esc(skill(k))}</textarea><button class="btn sm ghost" data-reset="${k}">استرجاع الأصل</button></div></details>`).join('')}
  </div>

  <div class="card set"><h3>🔊 صوت المعلّم</h3>
    <p class="muted" style="font-size:15px">اختر من يشرح للطالب، واضغط «تجربة» لتسمع صوته.</p>
    <div class="chars">${Object.entries(CHARS).map(([k, c]) => `<div class="char ${S.voice.char === k ? 'on' : ''}" data-char="${k}"><span class="em">${c.ic}</span><b>${c.name}</b><small>${c.sub}</small><button class="btn sm ghost" data-try="${k}">تجربة 🔊</button></div>`).join('')}</div>
    <div class="field"><label>سرعة القراءة</label>${speedSegHTML()}</div>
    ${inArtifact ? `<p class="note warn">في هذه المعاينة يُستخدم صوت جهازك، وهو صوت آلي، وتغيّر كل شخصية طبقته فقط. الأصوات البشرية عبر Gemini TTS وElevenLabs تحتاج اتصالاً خارجياً، فتعمل في نسخة التطبيق المستضافة.</p>` : `
    <div class="field"><label for="vEng">محرك الصوت</label><select id="vEng">
      <option value="auto" ${S.voice.engine === 'auto' ? 'selected' : ''}>تلقائي: Gemini ثم ElevenLabs ثم صوت الجهاز</option>
      <option value="gemini" ${S.voice.engine === 'gemini' ? 'selected' : ''}>Gemini TTS (بمفتاح Gemini نفسه)</option>
      <option value="eleven" ${S.voice.engine === 'eleven' ? 'selected' : ''}>ElevenLabs (مفتاح خاص)</option>
      <option value="device" ${S.voice.engine === 'device' ? 'selected' : ''}>صوت الجهاز (بدون إنترنت)</option></select></div>
    <div class="field"><label for="vModel">نموذج Gemini للصوت</label><input id="vModel" list="ttsList" dir="ltr" value="${esc(S.voice.ttsModel)}"><datalist id="ttsList"><option value="gemini-3.8-flash-lite-tts"><option value="gemini-3.8-flash-tts"><option value="gemini-3.1-flash-tts-preview"></datalist>
      <small class="muted">الأصوات: المعلّم Charon، المعلّمة Aoede، صديقي Puck، صديقتي Leda.</small></div>
    <details><summary>ElevenLabs (اختياري، ١٠ آلاف حرف مجاناً شهرياً)</summary>
      <div class="field" style="margin-top:8px"><label for="elKey">مفتاح ElevenLabs</label><div class="ansrow"><input id="elKey" type="password" dir="ltr" value="${esc(S.voice.el.key)}" autocomplete="off"><button class="eye" data-eye2="elKey" aria-label="إظهار">👁</button></div>
      <small class="muted">من <a class="lnk" href="https://elevenlabs.io/app/settings/api-keys" target="_blank" rel="noopener">elevenlabs.io</a>. الصق Voice ID لكل شخصية من مكتبة الأصوات.</small></div>
      ${Object.entries(CHARS).map(([k, c]) => `<div class="field"><label for="el-${k}">${c.ic} ${c.name}: Voice ID</label><input id="el-${k}" dir="ltr" value="${esc(S.voice.el.ids[k])}"></div>`).join('')}
    </details>`}
  </div>

  <div class="card set"><h3>📷 جودة الصورة المرسلة للفحص</h3>
    <div class="seg" id="qual"><button data-v="1280" class="${S.imgMax == 1280 ? 'on' : ''}">عادية (أسرع)</button><button data-v="1600" class="${S.imgMax == 1600 ? 'on' : ''}">عالية (للخط الصغير)</button></div>
    <small class="muted">هذه للنسخة المرسلة للذكاء الاصطناعي فقط. صورتك الأصلية تُحفظ بدقتها الكاملة للعرض والتصدير.</small>
  </div>

  <div class="card set"><h3>🗂️ البيانات</h3>
    <div class="row"><button class="btn sm ghost" id="rsStars">تصفير النجوم</button><button class="btn sm ghost" id="rsMist">مسح دفتر الأخطاء</button></div>
    <p class="note">ملاحظة خصوصية: في الباقات المجانية قد تستخدم الشركات الطلبات لتحسين خدماتها؛ تجنّب تصوير الوجوه والأسماء.</p>
  </div>
  <p class="foot">المعلّم الذكي • نموذج حي ${VERSION}</p>`;

  const bind = (sel, fn) => { const e = $(sel, v); if (e) e.addEventListener('change', () => { fn(e.value); save(); }); };
  bind('#pName', x => { S.profile.name = x.trim(); });
  bind('#pGrade', x => { S.profile.grade = +x; });
  bind('#pCurr', x => { S.profile.curriculum = x.trim(); });
  $$('#pGen button', v).forEach(b => b.onclick = () => { S.profile.gender = b.dataset.v; save(); $$('#pGen button', v).forEach(x => x.classList.toggle('on', x === b)); });
  for (const id of ['gemini', 'openrouter']) bind('#k-' + id, x => { S.keys[id] = x.trim(); refreshEngineUI(); });
  bind('#mGem', x => { S.models.gemini = x.trim() || DEF.models.gemini; });
  bind('#mOr', x => { S.models.openrouter = x.trim() || DEF.models.openrouter; });
  bind('#lGem', x => { S.links.gem = x.trim(); });
  bind('#vEng', x => { S.voice.engine = x; });
  bind('#vModel', x => { S.voice.ttsModel = x.trim() || DEF.voice.ttsModel; });
  bind('#elKey', x => { S.voice.el.key = x.trim(); });
  for (const k of Object.keys(CHARS)) bind('#el-' + k, x => { S.voice.el.ids[k] = x.trim(); });
  $$('[data-eye2]', v).forEach(b => b.onclick = () => { const i = $('#' + b.dataset.eye2, v); i.type = i.type === 'password' ? 'text' : 'password'; });
  $$('[data-eye]', v).forEach(b => b.onclick = () => { const i = $('#k-' + b.dataset.eye, v); i.type = i.type === 'password' ? 'text' : 'password'; });
  $$('[data-skill]', v).forEach(t => t.onchange = () => { S.skills[t.dataset.skill] = t.value; save(); toast('حُفظت المهارة ✓'); });
  $$('[data-reset]', v).forEach(b => b.onclick = () => { delete S.skills[b.dataset.reset]; save(); $(`[data-skill="${b.dataset.reset}"]`, v).value = SKILLS[b.dataset.reset]; toast('عادت للأصل'); });
  $$('#qual button', v).forEach(b => b.onclick = () => { S.imgMax = +b.dataset.v; save(); $$('#qual button', v).forEach(x => x.classList.toggle('on', x === b)); });
  $('#cpGem', v).onclick = () => { try { navigator.clipboard.writeText(GEM_TEXT()).then(() => toast('نُسخت التعليمات ✓'), () => openSheet(`<h3>انسخ التعليمات يدوياً</h3><textarea style="width:100%;min-height:260px">${esc(GEM_TEXT())}</textarea><button class="btn" data-close>تم</button>`)); } catch (e) {} };
  $('#rsStars', v).onclick = () => { S.stars = 0; save(); updateStars(); toast('صُفّرت النجوم'); };
  $('#rsMist', v).onclick = () => { S.mistakes = []; save(); updateBadge(); toast('مُسح الدفتر'); };
  if ($('#testGem', v)) $('#testGem', v).onclick = async () => {
    const out = $('#gemOut', v), key = $('#k-gemini', v).value.trim();
    if (!key) { out.textContent = 'الصق المفتاح أولاً.'; return; }
    S.keys.gemini = key; save(); out.textContent = 'جارٍ التحقق…';
    try {
      const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', { headers: { 'x-goog-api-key': key } }).catch(netErr);
      if (!res.ok) throw await httpErr(res);
      const d = await res.json();
      const names = (d.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent') && /flash/i.test(m.name)).map(m => m.name.replace('models/', ''));
      $('#gemList', v).innerHTML = names.map(n => `<option value="${esc(n)}">`).join('');
      out.innerHTML = `✓ المفتاح يعمل. النماذج المتاحة: <span dir="ltr">${esc(names.slice(0, 8).join('، '))}</span>`;
    } catch (e) { out.textContent = '✗ ' + e.message; }
    refreshEngineUI();
  };
}

/* ============ بدء التشغيل ============ */
updateStars(); refreshEngineUI(); renderHome(); show('home');
/* تثبيت التطبيق والعمل بدون إنترنت (في النسخة المستضافة فقط) */
if (!inArtifact && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
